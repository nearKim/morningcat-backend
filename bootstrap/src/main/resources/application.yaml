ktor:
  deployment:
    port: 8080
    host: 0.0.0.0

morningcat:
  database:
    postgres:
      host: localhost
      port: 5432
      database: morningcat
      username: morningcat
      password: ${DB_PASSWORD:morningcat}

  delivery:
    default_time: "07:00"
    timezone: "Asia/Seoul"
    retry_attempts: 3
    
  smtp:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    auth_required: ${SMTP_AUTH_REQUIRED:false}
    tls_enabled: ${SMTP_TLS_ENABLED:false}
    ssl_enabled: ${SMTP_SSL_ENABLED:false}
    from_email: ${SMTP_FROM_EMAIL:noreply@morningcat.app}
    from_name: ${SMTP_FROM_NAME:MorningCat}
    reply_to_email: ${SMTP_REPLY_TO_EMAIL:support@morningcat.app}

  content:
    cache_ttl: 3600
    generation_timeout: 30

  integrations:
    weather:
      api_key: ${WEATHER_API_KEY}
      base_url: "https://api.openweathermap.org"
    news:
      api_key: ${NEWS_API_KEY}
      base_url: "https://newsapi.org"
    alpha_vantage:
      api_key: ${ALPHA_VANTAGE_API_KEY}
      base_url: "https://www.alphavantage.co"
    google_calendar:
      credentials_path: ${GOOGLE_CALENDAR_CREDENTIALS_PATH:}
    todoist:
      api_key: ${TODOIST_API_KEY:}
    holiday_api:
      api_key: ${HOLIDAY_API_KEY:}
      base_url: "https://holidayapi.com"